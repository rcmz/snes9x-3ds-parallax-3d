# 32K LoROM. Bank 0 holds the whole ROM at $8000, with the cartridge header
# and the vectors in their fixed places at the top of it.
MEMORY {
    ZP:      start = $000000, size = $0100, type = rw;
    RAM:     start = $000100, size = $1F00, type = rw;
    ROM:     start = $008000, size = $7FB0, type = ro, fill = yes, fillval = $00, file = %O;
    HEADER:  start = $00FFB0, size = $0030, type = ro, fill = yes, fillval = $00, file = %O;
    VECTORS: start = $00FFE0, size = $0020, type = ro, fill = yes, fillval = $00, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = RAM,     type = bss;
    CODE:     load = ROM,     type = ro,  start = $008000;
    RODATA:   load = ROM,     type = ro;
    CARTINFO: load = HEADER,  type = ro,  start = $00FFC0;
    VECTORS:  load = VECTORS, type = ro;
}
